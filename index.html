<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0e1117" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>G7X AI Cam</title>
    <style>
      :root {
        --bg: #0a0f17;
        --panel: rgba(17, 22, 30, 0.78);
        --panel-strong: rgba(21, 28, 38, 0.95);
        --text: #edf5ff;
        --muted: #aebfd9;
        --accent: #73c5ff;
        --accent-2: #84d7c0;
        --danger: #ff6d7a;
        --button: rgba(255, 255, 255, 0.08);
        --button-strong: rgba(255, 255, 255, 0.14);
        --shadow: rgba(0, 0, 0, 0.35);
        --capture-ring: rgba(255, 255, 255, 0.82);
        --capture-inner: #ffffff;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        overscroll-behavior: none;
      }

      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: stretch;
        overflow: hidden;
        padding: max(0.75rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right)) max(0.75rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
      }

      button, input {
        font: inherit;
      }

      button {
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 999px;
        background: var(--button);
        color: var(--text);
        min-height: 48px;
        min-width: 48px;
        padding: 0.7rem 0.95rem;
        touch-action: manipulation;
        transition: transform 0.15s ease, background 0.2s ease, opacity 0.2s ease;
      }

      button:active { transform: scale(0.98); }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.45;
      }

      button:focus-visible,
      input:focus-visible,
      dialog:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }

      .camera-shell {
        position: relative;
        width: 100%;
        height: 100%;
        max-width: 520px;
        margin: 0 auto;
        overflow: hidden;
        background: #000;
        border-radius: 22px;
        box-shadow: 0 18px 40px var(--shadow);
      }

      #camera {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        background: #000;
        transform: scaleX(1);
      }

      .camera-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(to top, rgba(0,0,0,0.42), rgba(0,0,0,0.08) 30%, rgba(0,0,0,0.08));
        pointer-events: none;
      }

      .controls {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: max(1rem, env(safe-area-inset-top)) 0.85rem calc(1.2rem + env(safe-area-inset-bottom));
        z-index: 2;
      }

      .top-row {
        display: flex;
        align-items: stretch;
        gap: 0.45rem;
        justify-content: space-between;
      }

      .action-btn {
        flex: 1 1 0;
        min-height: 48px;
        background: rgba(19, 26, 35, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        padding: 0.55rem 0.35rem;
      }

      .action-btn[data-pressed="true"] {
        background: rgba(115, 197, 255, 0.2);
        border-color: rgba(115, 197, 255, 0.7);
      }

      .capture-wrap {
        display: flex;
        justify-content: center;
        align-items: center;
        padding-bottom: 0.3rem;
      }

      .capture-btn {
        position: relative;
        width: clamp(74px, 18vw, 90px);
        height: clamp(74px, 18vw, 90px);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        border: 5px solid rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 5px rgba(0, 0, 0, 0.15);
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .capture-btn::before {
        content: "";
        width: 62%;
        height: 62%;
        background: radial-gradient(circle at 35% 35%, #ffffff 0%, #f1f7ff 30%, #dfeeff 100%);
        border-radius: 50%;
        box-shadow: inset 0 0 10px rgba(5, 30, 60, 0.12);
      }

      .capture-btn:disabled {
        opacity: 0.65;
      }

      .status-bar {
        position: absolute;
        left: 0.85rem;
        right: 0.85rem;
        bottom: calc(7rem + env(safe-area-inset-bottom));
        z-index: 3;
        pointer-events: none;
      }

      #status {
        display: block;
        width: 100%;
        padding: 0.6rem 0.8rem;
        background: rgba(9, 14, 21, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 14px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        color: var(--text);
        font-size: 0.8rem;
        line-height: 1.3;
        min-height: 44px;
        display: flex;
        align-items: center;
      }

      dialog {
        border: none;
        border-radius: 20px;
        background: #101924;
        color: var(--text);
        width: min(92vw, 420px);
        padding: 0;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
      }

      dialog::backdrop {
        background: rgba(2, 6, 12, 0.7);
      }

      .dialog-card {
        padding: 1rem 1rem 0.8rem;
      }

      .dialog-title {
        margin: 0 0 0.7rem;
        font-size: 1.1rem;
      }

      .dialog-body {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }

      .dialog-input {
        width: 100%;
        min-height: 48px;
        border-radius: 12px;
        border: 1px solid rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        padding: 0.85rem 0.9rem;
      }

      .dialog-actions {
        display: flex;
        gap: 0.6rem;
        justify-content: flex-end;
        padding-top: 0.35rem;
      }

      .dialog-actions button {
        min-width: 90px;
      }

      .primary-btn {
        background: linear-gradient(180deg, rgba(115, 197, 255, 0.3), rgba(115, 197, 255, 0.18));
        border-color: rgba(115, 197, 255, 0.7);
      }

      .secondary-btn {
        background: rgba(255,255,255,0.06);
      }

      .result-dialog-image {
        width: 100%;
        max-height: 60vh;
        object-fit: contain;
        border-radius: 16px;
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.08);
      }

      .hidden {
        display: none !important;
      }

      @media (max-width: 360px) {
        .top-row {
          gap: 0.28rem;
        }

        .action-btn {
          font-size: 0.72rem;
          padding: 0.55rem 0.2rem;
        }
      }
    </style>
  </head>
  <body>
    <main class="camera-shell" aria-label="Camera app main screen">
      <video id="camera" playsinline autoplay muted></video>

      <div class="controls">
        <div class="top-row" aria-label="Camera action buttons">
          <button
            id="flashBtn"
            class="action-btn"
            type="button"
            aria-label="Flash off. Double tap to toggle"
            aria-pressed="false"
            disabled
          >
            Flash
          </button>

          <button
            id="aiToggle"
            class="action-btn"
            type="button"
            aria-label="AI on. Double tap to toggle"
            aria-pressed="true"
            data-pressed="true"
          >
            AI On
          </button>

          <button
            id="flipBtn"
            class="action-btn"
            type="button"
            aria-label="Flip camera. Double tap to switch camera"
          >
            Flip
          </button>

          <button
            id="apiKeyBtn"
            class="action-btn"
            type="button"
            aria-label="Open API key dialog"
          >
            API Key
          </button>
        </div>

        <div class="status-bar">
          <p id="status" role="status" aria-live="polite">Camera ready.</p>
        </div>

        <div class="capture-wrap">
          <button
            id="captureBtn"
            class="capture-btn"
            type="button"
            aria-label="Capture photo"
          ></button>
        </div>
      </div>
    </main>

    <dialog id="apiKeyDialog" aria-labelledby="apiKeyTitle">
      <div class="dialog-card">
        <h2 id="apiKeyTitle" class="dialog-title">OpenAI API Key</h2>
        <div class="dialog-body">
          <label class="sr-only" for="apiKeyInput" style="position:absolute;left:-9999px;">OpenAI API key</label>
          <input
            id="apiKeyInput"
            class="dialog-input"
            type="password"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="sk-..."
          />
          <div class="dialog-actions">
            <button id="saveApiKeyBtn" class="primary-btn" type="button">Save</button>
            <button id="closeApiKeyBtn" class="secondary-btn" type="button">Close</button>
          </div>
        </div>
      </div>
    </dialog>

    <dialog id="resultDialog" aria-labelledby="resultTitle">
      <div class="dialog-card">
        <h2 id="resultTitle" class="dialog-title">Photo result</h2>
        <div class="dialog-body">
          <img id="resultImage" class="result-dialog-image" alt="Captured and processed result" />
          <div class="dialog-actions">
            <button id="saveResultBtn" class="primary-btn" type="button" aria-label="Save result photo">Save</button>
            <button id="shareResultBtn" class="secondary-btn" type="button" aria-label="Share result photo" hidden>Share</button>
            <button id="closeResultBtn" class="secondary-btn" type="button" aria-label="Close result dialog">Close</button>
          </div>
        </div>
      </div>
    </dialog>

    <script>
      const statusEl = document.getElementById('status');
      const cameraEl = document.getElementById('camera');
      const flashBtn = document.getElementById('flashBtn');
      const aiToggleBtn = document.getElementById('aiToggle');
      const flipBtn = document.getElementById('flipBtn');
      const apiKeyBtn = document.getElementById('apiKeyBtn');
      const captureBtn = document.getElementById('captureBtn');
      const apiKeyDialog = document.getElementById('apiKeyDialog');
      const resultDialog = document.getElementById('resultDialog');
      const apiKeyInput = document.getElementById('apiKeyInput');
      const resultImage = document.getElementById('resultImage');
      const saveResultBtn = document.getElementById('saveResultBtn');
      const shareResultBtn = document.getElementById('shareResultBtn');
      const closeResultBtn = document.getElementById('closeResultBtn');

      const STORAGE_KEYS = {
        apiKey: 'g7x-ai-cam-api-key',
        aiEnabled: 'g7x-ai-cam-ai-enabled'
      };

      const PROMPT = "Make this photo look like it was taken using a Canon G7X with the flash on. Do not change my face, features, body proportions, or the original background";

      const state = {
        stream: null,
        facingMode: 'environment',
        flashSupported: false,
        flashOn: false,
        aiEnabled: true,
        isProcessing: false,
        lastResultBlob: null
      };

      function setStatus(message) {
        statusEl.textContent = message || 'Camera ready.';
      }

      function safeStorageGet(key) {
        try {
          return localStorage.getItem(key) || '';
        } catch (error) {
          return '';
        }
      }

      function safeStorageSet(key, value) {
        try {
          localStorage.setItem(key, value);
          return true;
        } catch (error) {
          return false;
        }
      }

      function updateAiState() {
        const enabled = state.aiEnabled;
        aiToggleBtn.setAttribute('aria-pressed', String(enabled));
        aiToggleBtn.setAttribute('data-pressed', String(enabled));
        aiToggleBtn.textContent = enabled ? 'AI On' : 'AI Off';
        aiToggleBtn.setAttribute(
          'aria-label',
          enabled ? 'AI on. Double tap to toggle' : 'AI off. Double tap to toggle'
        );
        try {
          safeStorageSet(STORAGE_KEYS.aiEnabled, String(enabled));
        } catch (error) {
          // no-op
        }
      }

      function updateFlashState() {
        const on = state.flashOn;
        flashBtn.setAttribute('aria-pressed', String(on));
        flashBtn.setAttribute('data-pressed', String(on));
        flashBtn.textContent = on ? 'Flash On' : 'Flash';
        flashBtn.setAttribute(
          'aria-label',
          on ? 'Flash on. Double tap to toggle' : 'Flash off. Double tap to toggle'
        );
      }

      function getStoredApiKey() {
        return safeStorageGet(STORAGE_KEYS.apiKey);
      }

      function openDialog(dialog) {
        if (typeof dialog.showModal === 'function') {
          dialog.showModal();
        } else {
          dialog.setAttribute('open', 'open');
        }
      }

      function closeDialog(dialog) {
        if (typeof dialog.close === 'function') {
          dialog.close();
        } else {
          dialog.removeAttribute('open');
        }
      }

      async function startCamera() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus('This browser does not support the camera API.');
          return;
        }

        try {
          const constraints = {
            video: {
              facingMode: { ideal: state.facingMode },
              width: { ideal: 1280 },
              height: { ideal: 1920 }
            },
            audio: false
          };

          const stream = await navigator.mediaDevices.getUserMedia(constraints);
          state.stream = stream;
          cameraEl.srcObject = stream;
          cameraEl.play();

          const track = stream.getVideoTracks()[0];
          if (track) {
            const capabilities = track.getCapabilities ? track.getCapabilities() : {};
            state.flashSupported = !!capabilities.torch;
            flashBtn.disabled = !state.flashSupported;
            if (!state.flashSupported) {
              flashBtn.textContent = 'Flash Unavailable';
              flashBtn.setAttribute('aria-label', 'Flash unavailable on this camera');
            } else {
              state.flashOn = false;
              updateFlashState();
            }
          }

          setStatus('Camera ready.');
        } catch (error) {
          setStatus('Camera access was denied. Please allow camera permissions.');
          console.error(error);
        }
      }

      async function toggleFlash() {
        if (!state.stream || !state.flashSupported) {
          setStatus('The current camera does not support a flash or torch.');
          return;
        }

        const videoTrack = state.stream.getVideoTracks()[0];
        if (!videoTrack || typeof videoTrack.applyConstraints !== 'function') {
          setStatus('This camera cannot toggle flash from the browser.');
          return;
        }

        state.flashOn = !state.flashOn;

        try {
          await videoTrack.applyConstraints({
            advanced: [{ torch: state.flashOn }]
          });
          updateFlashState();
          setStatus(state.flashOn ? 'Flash on.' : 'Flash off.');
        } catch (error) {
          state.flashOn = !state.flashOn;
          updateFlashState();
          setStatus('Flash toggle is not available for this camera.');
          console.error(error);
        }
      }

      async function flipCamera() {
        state.facingMode = state.facingMode === 'environment' ? 'user' : 'environment';

        if (state.stream) {
          state.stream.getTracks().forEach((track) => track.stop());
          state.stream = null;
        }

        await startCamera();
      }

      function handleApiKeyDialogOpen() {
        const key = getStoredApiKey();
        apiKeyInput.value = key;
        apiKeyInput.focus();
        openDialog(apiKeyDialog);
      }

      function saveApiKey() {
        const value = apiKeyInput.value.trim();
        if (!value) {
          setStatus('No API key entered. AI processing is off until you add a key.');
          closeDialog(apiKeyDialog);
          return;
        }

        const saved = safeStorageSet(STORAGE_KEYS.apiKey, value);
        if (!saved) {
          setStatus('Your browser blocked saving the API key. Please allow storage access.');
          return;
        }

        closeDialog(apiKeyDialog);
        setStatus('API key saved.');
      }

      function imageToBlobFromCanvas(canvas, type = 'image/jpeg', quality = 0.92) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => resolve(blob), type, quality);
        });
      }

      async function capturePhoto() {
        if (!cameraEl || state.isProcessing) {
          return;
        }

        if (!cameraEl.videoWidth || !cameraEl.videoHeight) {
          setStatus('Camera is not ready yet.');
          return;
        }

        state.isProcessing = true;
        captureBtn.disabled = true;
        setStatus('Capturing and processing...');

        const videoWidth = cameraEl.videoWidth;
        const videoHeight = cameraEl.videoHeight;
        const maxLongSide = 1536;
        const longSide = Math.max(videoWidth, videoHeight);
        const scale = longSide > maxLongSide ? maxLongSide / longSide : 1;
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(videoWidth * scale));
        canvas.height = Math.max(1, Math.round(videoHeight * scale));

        const context = canvas.getContext('2d');
        context.drawImage(cameraEl, 0, 0, canvas.width, canvas.height);

        const originalBlob = await imageToBlobFromCanvas(canvas, 'image/jpeg', 0.92);

        if (!state.aiEnabled || !getStoredApiKey()) {
          const reason = !state.aiEnabled ? 'AI is off. Showing the original photo.' : 'No API key saved. Showing the original photo.';
          showResultDialog(originalBlob, reason, true);
          return;
        }

        try {
          const apiKey = getStoredApiKey();
          const formData = new FormData();
          const imageFile = new File([originalBlob], 'capture.jpg', { type: 'image/jpeg' });

          formData.append('model', 'gpt-image-1');
          formData.append('input_fidelity', 'high');
          formData.append('image', imageFile, 'capture.jpg');
          formData.append('prompt', PROMPT);

          const response = await fetch('https://api.openai.com/v1/images/edits', {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${apiKey}`
            },
            body: formData
          });

          const responseJson = await response.json().catch(() => null);

          if (!response.ok || !responseJson || !responseJson.data || !responseJson.data[0] || !responseJson.data[0].b64_json) {
            const detail = responseJson && responseJson.error && responseJson.error.message
              ? responseJson.error.message
              : 'Unexpected API response';
            throw new Error(detail);
          }

          const b64 = responseJson.data[0].b64_json;
          const binary = atob(b64);
          const bytes = new Uint8Array(binary.length);
          for (let i = 0; i < binary.length; i += 1) {
            bytes[i] = binary.charCodeAt(i);
          }

          const pngBlob = new Blob([bytes], { type: 'image/png' });
          showResultDialog(pngBlob, 'AI edit complete.', false);
        } catch (error) {
          const message = error && error.message ? error.message : 'AI processing failed.';
          showResultDialog(originalBlob, message, true);
        } finally {
          state.isProcessing = false;
          captureBtn.disabled = false;
        }
      }

      function showResultDialog(blob, statusMessage, isOriginal) {
        const imageUrl = URL.createObjectURL(blob);
        resultImage.src = imageUrl;
        resultImage.alt = isOriginal ? 'Original captured photo' : 'AI-enhanced photo';
        state.lastResultBlob = blob;

        saveResultBtn.onclick = () => {
          const link = document.createElement('a');
          const fileName = isOriginal ? 'g7x-ai-cam-original.jpg' : 'g7x-ai-cam-result.png';
          const url = URL.createObjectURL(blob);
          link.href = url;
          link.download = fileName;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        };

        if (navigator.share && isOriginal === false) {
          shareResultBtn.hidden = false;
          shareResultBtn.onclick = async () => {
            try {
              const file = new File([blob], 'g7x-ai-cam-result.png', { type: 'image/png' });
              await navigator.share({
                title: 'G7X AI Cam result',
                text: 'My G7X-inspired AI camera photo.',
                files: [file]
              });
              setStatus('Photo shared.');
            } catch (error) {
              setStatus('Share was cancelled or not available.');
            }
          };
        } else {
          shareResultBtn.hidden = true;
        }

        setStatus(statusMessage);
        openDialog(resultDialog);
      }

      function setupEventListeners() {
        flashBtn.addEventListener('click', toggleFlash);
        aiToggleBtn.addEventListener('click', () => {
          state.aiEnabled = !state.aiEnabled;
          updateAiState();
          setStatus(state.aiEnabled ? 'AI mode on.' : 'AI mode off. Original photo will be shown.');
        });
        flipBtn.addEventListener('click', flipCamera);
        apiKeyBtn.addEventListener('click', handleApiKeyDialogOpen);
        captureBtn.addEventListener('click', capturePhoto);
        document.getElementById('saveApiKeyBtn').addEventListener('click', saveApiKey);
        document.getElementById('closeApiKeyBtn').addEventListener('click', () => closeDialog(apiKeyDialog));
        closeResultBtn.addEventListener('click', () => closeDialog(resultDialog));
        resultDialog.addEventListener('close', () => {
          if (resultImage.src) {
            URL.revokeObjectURL(resultImage.src);
            resultImage.removeAttribute('src');
          }
        });
      }

      function initialize() {
        state.aiEnabled = safeStorageGet(STORAGE_KEYS.aiEnabled) === 'false' ? false : true;
        updateAiState();
        updateFlashState();
        setupEventListeners();

        if ('serviceWorker' in navigator) {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js').catch((error) => {
              console.warn('Service worker registration failed:', error);
            });
          });
        }

        startCamera();
      }

      initialize();
    </script>
  </body>
</html>
